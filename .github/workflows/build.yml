name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write  # publish the release on version tags

jobs:
  windows:
    runs-on: windows-latest
    env:
      POMELOO_NO_DOWNLOAD: "1"  # CI has no Office suite; skip the 375 MB slide-engine download
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -e . pyinstaller ziglang

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (python -c "import pomeloo; print(pomeloo.__version__)").Trim()
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} but pomeloo.__version__ is $v" }

      - name: Test (every conversion pair and tool, outputs opened and validated)
        run: python tests/test_convert.py

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build app, C helpers and installer
        shell: pwsh
        run: ./scripts/build.ps1 -Python python -Installer

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $v = (python -c "import pomeloo; print(pomeloo.__version__)").Trim()
          Compress-Archive -Path dist/PomeloO/* -DestinationPath "dist/PomeloO-$v-portable.zip"
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: PomeloO-${{ steps.pkg.outputs.version }}
          path: |
            dist/PomeloO-Setup-${{ steps.pkg.outputs.version }}.exe
            dist/PomeloO-${{ steps.pkg.outputs.version }}-portable.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PomeloO ${{ steps.pkg.outputs.version }}
          body_path: .github/RELEASE.md
          files: |
            dist/PomeloO-Setup-${{ steps.pkg.outputs.version }}.exe
            dist/PomeloO-${{ steps.pkg.outputs.version }}-portable.zip
